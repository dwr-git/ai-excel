<!DOCTYPE html>
<html lang="ru" data-app-bytes="0">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AI-Excel">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#0e0f1a">
  <title>AI-Excel</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- Shows download progress and, if the start fails, which file and why. Everything loads from this folder only. -->
  <script src="studio/loader.js"></script>
  <link data-trunk rel="rust" data-bin="ai-excel" data-wasm-opt="z" data-weak-refs />
  <style>
    /* iPad: no page scroll, bounce, pinch zoom, text selection or callout; the app takes the gestures. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0e0f1a;
      overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
    /* Inside the safe areas (notch, home indicator) of a full-screen app. */
    #gridcraft_canvas { position: absolute; top: env(safe-area-inset-top, 0); right: env(safe-area-inset-right, 0);
      bottom: env(safe-area-inset-bottom, 0); left: env(safe-area-inset-left, 0);
      width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      display: block; touch-action: none; }
    #gridcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 16px; text-align: center; color: #c4cbe6; font: 14px system-ui, sans-serif; pointer-events: none; }
    #gridcraft_loading p { margin: 0 0 8px; max-width: 460px; line-height: 1.5; }
    #gridcraft_loading a { color: #a9b4ff; pointer-events: auto; }
    #ap_track { width: min(320px, 80vw); height: 6px; margin: 4px 0 10px; border-radius: 3px; background: rgba(196, 203, 230, .15); overflow: hidden; }
    #ap_bar { width: 0; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #667eea, #764ba2); transition: width .2s; }
    #ap_progress { font-variant-numeric: tabular-nums; min-height: 1.5em; }
    #ap_problem { color: #ff9b8f; text-align: left; pointer-events: auto; user-select: text; -webkit-user-select: text; }
    #ap_problem[hidden] { display: none; }
    /* The app removes this element once it runs. If the WebAssembly never downloads or doesn't match
       this page, no Rust runs to say so, so the page itself shows what to do after a while. */
    #gridcraft_stalled { color: #9aa0bf; visibility: hidden; animation: gridcraft-stalled 0s 25s forwards; }
    @keyframes gridcraft-stalled { to { visibility: visible; } }
  </style>
  <!-- Studio: the assistant panel (studio/web in the repository, copied next to this page by studio/build/package.sh). -->
  <link rel="stylesheet" href="studio/studio.css">
  <script src="studio/config.js"></script>
  <script src="studio/studio.js" defer></script>
</head>
<body>
  <canvas id="gridcraft_canvas"></canvas>
  <div id="gridcraft_loading">
    <p>Загрузка AI-Excel&hellip;</p>
    <div id="ap_track"><div id="ap_bar"></div></div>
    <p id="ap_progress"></p>
    <p id="ap_problem" hidden></p>
    <p id="gridcraft_stalled">Загрузка идёт дольше обычного. Если AI-Excel не запускается, файлы могли не скачаться
      или относиться к другой версии страницы. <a href="">Обновите страницу</a>; подробности — в консоли браузера (F12).</p>
  </div>
</body>
</html>
