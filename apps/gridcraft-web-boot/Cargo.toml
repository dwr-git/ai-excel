[package]
name = "gridcraft-web-boot"
description = "Starts AI-Excel in the browser from compressed parts of its WebAssembly"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
# The shipped file names (ai-excel-<hash>.js / _bg.wasm) come from this name.
name = "ai-excel"
path = "src/main.rs"

[dependencies]
# Inflates the parts in browsers without `DecompressionStream`.
flate2 = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Node", "Request", "RequestInit", "RequestCache", "Response", "Headers", "Blob", "ReadableStream", "WritableStream", "ReadableWritablePair", "Url", "console"] }
